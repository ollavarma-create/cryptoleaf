name: Build Linux AppImage

on:
  push:
    branches:
      - ci/appimage
      - feature/fourier-dwt-rs8
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'assets/*.ico'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'assets/*.ico'
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest build for each branch or pull request.
# workflow_dispatch is intentionally included in this grouping.
concurrency:
  group: appimage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-keysyms1 \
            libxcb-shape0 libxcb-icccm4 libxcb-image0 \
            libxcb-render-util0 libxcb-xkb1 libfuse2 libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

      - name: Verify Qt XCB plugin dependencies
        run: |
          python - <<'PY'
          import pathlib
          from PyQt6.QtCore import QLibraryInfo
          import subprocess
          plugin = pathlib.Path(QLibraryInfo.path(QLibraryInfo.LibraryPath.PluginsPath)) / "platforms/libqxcb.so"
          result = subprocess.run(["ldd", str(plugin)], text=True, capture_output=True, check=True)
          print(result.stdout)
          if "not found" in result.stdout:
              raise SystemExit("Qt XCB dependencies are missing before packaging")
          PY

      - name: Build AppImage
        run: bash packaging/build-appimage.sh

      - name: Smoke-test bundled GUI under Xvfb
        shell: bash
        run: |
          set -Eeuo pipefail
          APPIMAGE="$PWD/dist/Cryptoleaf-v0.3-dev-x86_64.AppImage"
          # A GUI should remain alive; a rapid exit usually indicates missing
          # bundled libraries or a PyInstaller/Qt startup failure.
          export APPIMAGE
          timeout 35s xvfb-run -a bash -c '
            set -eu
            "$APPIMAGE" > /tmp/cryptoleaf-appimage.log 2>&1 &
            pid=$!
            sleep 12
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/cryptoleaf-appimage.log
              wait "$pid"
              exit 1
            fi
            kill "$pid"
            wait "$pid" || true
            cat /tmp/cryptoleaf-appimage.log
          '

      - name: Upload AppImage build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cryptoleaf-v0.3-dev-linux-x86_64
          path: dist/Cryptoleaf-v0.3-dev-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
